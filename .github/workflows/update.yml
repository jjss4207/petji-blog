name: Update feed

on:
  schedule:
    - cron: "0 0,6,12,18 * * *" # UTC 기준 하루 4번 (KST 09, 15, 21, 03시)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch feeds and rebuild site
        run: node scripts/fetch-feeds.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/items.json docs/index.html
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
